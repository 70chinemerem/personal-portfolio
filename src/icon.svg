<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background with gradient -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#grad1)"/>
  
  <!-- Letter U - Stylized -->
  <path d="M 60 80 
           Q 60 60 75 60 
           L 85 60 
           L 85 110 
           Q 85 130 100 130 
           Q 115 130 115 110 
           L 115 60 
           L 125 60 
           Q 140 60 140 80" 
        fill="none" 
        stroke="white" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Letter C - Stylized -->
  <path d="M 150 80 
           Q 150 60 170 60 
           Q 180 60 180 70 
           Q 180 80 170 80 
           Q 160 80 160 90 
           Q 160 100 170 100 
           Q 180 100 180 110 
           Q 180 120 170 120 
           Q 150 120 150 100" 
        fill="none" 
        stroke="url(#grad2)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Decorative corner elements -->
  <circle cx="30" cy="30" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="170" cy="30" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="30" cy="170" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="170" cy="170" r="4" fill="rgba(255,255,255,0.6)"/>
</svg>
